version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cybersentinel_db
    restart: always
    environment:
      POSTGRES_USER: cybersentinel
      POSTGRES_PASSWORD: CyberSentinelPostgresPass2026!
      POSTGRES_DB: cybersentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersentinel -d cybersentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cybersentinel_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cybersentinel_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://cybersentinel:CyberSentinelPostgresPass2026!@db:5432/cybersentinel
      SECRET_KEY: enterprise_cybersentinel_jwt_secret_2026
      NMAP_PATH: /usr/bin/nmap
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploaded_pcaps:/app/uploaded_pcaps
      - ./generated_reports:/app/generated_reports

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cybersentinel_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
